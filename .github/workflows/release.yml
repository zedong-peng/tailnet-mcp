name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
env:
  NAME: tailnet-mcp
  MCP_PUBLISHER_VERSION: v1.8.7
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: binaries
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$NAME-${target%/*}-${target#*/}" .
          done
          (cd dist && sha256sum $NAME-* > SHA256SUMS)
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
  registry:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # MCP Registry login
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: publish to the MCP Registry
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          base=https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION
          curl -fsSLO "$base/$archive" -fsSLO "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
          tar xzf "$archive" mcp-publisher
          jq --arg v "${GITHUB_REF_NAME#v}" --arg t "$GITHUB_REF_NAME" \
            '.version = $v | .packages[0].identifier |= sub(":[^:]*$"; ":" + $t)' server.json > server.tmp
          mv server.tmp server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
